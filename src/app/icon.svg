  <g fill="#33333A">
    <rect x="4"  y="4"  width="7" height="1.6"/><rect x="4"  y="4"  width="1.6" height="7"/>
    <rect x="21" y="4"  width="7" height="1.6"/><rect x="26.4" y="4" width="1.6" height="7"/>
    <rect x="4"  y="26.4" width="7" height="1.6"/><rect x="4" y="21" width="1.6" height="7"/>
    <rect x="21" y="26.4" width="7" height="1.6"/><rect x="26.4" y="21" width="1.6" height="7"/>
  </g>
  <rect x="9" y="15.2" width="14" height="1.8" fill="#FF5A1F"/>
</svg>
